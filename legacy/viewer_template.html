<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Ant Colony 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110e; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center;
         background: rgba(20,17,14,.75); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  #hud input[type=range] { flex: 1; }
  #hud button { background: #3a322a; color: #eee; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  #info { position: fixed; top: 12px; left: 12px; background: rgba(20,17,14,.75); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div id="info">
  <b>Digital ant colony</b><br>
  Food delivered: <span id="deliv">0</span><br>
  <span style="color:#6f6">&#9679;</span> food &nbsp; <span style="color:#c4f">&#9679;</span> poison &nbsp; <span style="color:#fa4">&#9679;</span> carrying<br>
  Drag to rotate, wheel to zoom
</div>
<div id="hud">
  <button id="play">Pause</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = __DATA__;
const A = DATA.arena, H = A / 2, F = DATA.frames, N = F[0].a.length;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14110e);
scene.fog = new THREE.Fog(0x14110e, 70, 140);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xfff2dd, 0x2a2018, 0.9));
const sun = new THREE.DirectionalLight(0xffe9c4, 0.8); sun.position.set(30, 50, 20); scene.add(sun);

// ground + pheromone overlay
const ground = new THREE.Mesh(new THREE.PlaneGeometry(A, A), new THREE.MeshLambertMaterial({ color: 0x5a4632 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const pc = document.createElement('canvas'); pc.width = pc.height = A;
const pctx = pc.getContext('2d'), pimg = pctx.createImageData(A, A);
const ptex = new THREE.CanvasTexture(pc); ptex.magFilter = THREE.LinearFilter;
const pher = new THREE.Mesh(new THREE.PlaneGeometry(A, A), new THREE.MeshBasicMaterial({ map: ptex, transparent: true, depthWrite: false }));
pher.rotation.x = -Math.PI / 2; pher.position.y = 0.03; scene.add(pher);
const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(A, 1, A)), new THREE.LineBasicMaterial({ color: 0x8a6d4a }));
edge.position.y = 0.5; scene.add(edge);

// nest
const nest = new THREE.Mesh(new THREE.ConeGeometry(3.2, 2.2, 24), new THREE.MeshLambertMaterial({ color: 0x3b2c1e }));
nest.position.set(DATA.nest[0] - H, 1.1, DATA.nest[1] - H); scene.add(nest);

// sources
const srcMeshes = [];
for (let i = 0; i < F[0].s.length; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14),
    new THREE.MeshLambertMaterial({ color: F[0].s[i][0] === 'food' ? 0x55dd55 : 0xcc44ff, emissive: F[0].s[i][0] === 'food' ? 0x113311 : 0x330044 }));
  scene.add(m); srcMeshes.push(m);
}

// ants
function makeAnt() {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0x1a1210 });
  const seg = (r, sx, x) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat); m.scale.set(sx, 0.8, 0.8); m.position.set(x, 0.55, 0); g.add(m); };
  seg(0.38, 1.4, -0.75); seg(0.26, 1.1, -0.05); seg(0.24, 1, 0.5);
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6 * 2 * 3), 3));
  const legs = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x1a1210 })); g.add(legs);
  const food = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), new THREE.MeshLambertMaterial({ color: 0xffaa33, emissive: 0x663300 }));
  food.position.set(0.85, 0.7, 0); g.add(food);
  g.userData = { legs, food }; g.scale.setScalar(1.3);
  scene.add(g); return g;
}
const ants = Array.from({ length: N }, makeAnt);

function setLegs(ant, phase) {
  const p = ant.userData.legs.geometry.attributes.position.array;
  let k = 0;
  for (let i = 0; i < 6; i++) {
    const side = i % 2 ? 1 : -1, x = -0.2 + (Math.floor(i / 2) - 1) * 0.35;
    const sw = Math.sin(phase + i * 2.1) * 0.25;
    p[k++] = x; p[k++] = 0.5; p[k++] = side * 0.2;
    p[k++] = x + sw; p[k++] = 0.02; p[k++] = side * 0.85;
  }
  ant.userData.legs.geometry.attributes.position.needsUpdate = true;
}

function drawPher(frame) {
  let f = frame, j = Math.floor(frame / 5) * 5; while (j > 0 && !F[j].p) j--;
  const p = F[j].p; if (!p) return;
  for (let i = 0; i < A * A; i++) {
    const v = Math.min(1, p[i] * 0.6), o = i * 4;
    pimg.data[o] = 255; pimg.data[o + 1] = 120 + 100 * v; pimg.data[o + 2] = 40;
    pimg.data[o + 3] = Math.min(230, 255 * Math.sqrt(v));
  }
  pctx.putImageData(pimg, 0, 0); ptex.needsUpdate = true;
}

// orbit camera
let theta = 0.8, phi = 0.95, dist = 62, drag = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => { if (!drag) return; theta -= (e.clientX - lx) * 0.006; phi = Math.max(0.15, Math.min(1.5, phi - (e.clientY - ly) * 0.006)); lx = e.clientX; ly = e.clientY; });
addEventListener('wheel', e => { dist = Math.max(12, Math.min(110, dist * (1 + e.deltaY * 0.001))); }, { passive: true });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// playback
let t = 0, playing = true, last = performance.now(), lastPher = -1;
const seek = document.getElementById('seek'), speedSel = document.getElementById('speed'), playBtn = document.getElementById('play');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };
seek.oninput = () => { t = seek.value / 1000 * (F.length - 1); };
function angLerp(a, b, k) { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * k; }

function frame(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing) { t += dt * 30 * parseFloat(speedSel.value); if (t >= F.length - 1) t = 0; seek.value = t / (F.length - 1) * 1000; }
  const i = Math.floor(t), k = t - i, f0 = F[i], f1 = F[Math.min(i + 1, F.length - 1)];
  for (let n = 0; n < N; n++) {
    const a = f0.a[n], b = f1.a[n], ant = ants[n];
    const wrap = Math.hypot(b[0] - a[0], b[1] - a[1]) > 5; // ignore jumps
    const x = wrap ? a[0] : a[0] + (b[0] - a[0]) * k, y = wrap ? a[1] : a[1] + (b[1] - a[1]) * k;
    ant.position.set(x - H, 0, y - H);
    ant.rotation.y = -angLerp(a[2], b[2], k);
    ant.userData.food.visible = !!a[3];
    setLegs(ant, now / 60 + n);
  }
  f0.s.forEach((s, m) => {
    const r = s[0] === 'food' ? 0.5 + 0.12 * s[3] : 1.0;
    srcMeshes[m].scale.setScalar(r); srcMeshes[m].position.set(s[1] - H, r * 0.8, s[2] - H);
  });
  if (i !== lastPher) { drawPher(i); lastPher = i; }
  document.getElementById('deliv').textContent = f0.d;
  camera.position.set(Math.sin(theta) * Math.cos(phi) * dist, Math.sin(phi) * dist, Math.cos(theta) * Math.cos(phi) * dist);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
