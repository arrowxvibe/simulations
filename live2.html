<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Ant Colony: Queen and Workers</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110e; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
  canvas { display: block; }
  .panel { position: fixed; background: rgba(20,17,14,.8); padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
  #info { top: 12px; left: 12px; }
  #side { top: 12px; right: 12px; width: 330px; max-height: calc(100% - 24px); overflow: auto; }
  #side table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #side td, #side th { padding: 2px 4px; text-align: right; }
  #side th:first-child, #side td:first-child, #side th:nth-child(2), #side td:nth-child(2) { text-align: left; }
  #side th { color: #aaa; font-weight: 500; }
  #log div { color: #ccc; font-size: 12px; border-top: 1px solid #332b24; padding: 2px 0; }
  #status { position: fixed; bottom: 12px; left: 12px; padding: 6px 10px; border-radius: 6px; background: rgba(20,17,14,.8); font-size: 13px; }
  button { background: #3a322a; color: #eee; border: 0; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .s0 { color: #9ad; } .s1 { color: #fa4; } .s2 { color: #f88; } .s3, .s4 { color: #c9a26b; } .s5 { color: #ffd34d; }
  @media (max-width: 700px) { #side { width: 230px; font-size: 11px; } }
</style>
</head>
<body>
<div id="info" class="panel">
  <b>Live ant colony</b> &nbsp;<span style="color:#999">1 queen + workers</span><br>
  Food in store: <b id="store">0</b> &nbsp; Delivered: <b id="deliv">0</b><br>
  Ants: <b id="pop">0</b> / room for <b id="cap">0</b> &nbsp; Chambers: <b id="ch">1</b><br>
  Born: <b id="born">0</b> &nbsp; Died: <b id="died">0</b> &nbsp; Brood: <b id="brood">0</b><br>
  <span style="color:#6f6">&#9679;</span> food <span style="color:#c4f">&#9679;</span> poison
  <span style="color:#f5f0e0">&#9679;</span> egg <span style="color:#e8d9a0">&#9679;</span> larva <span style="color:#b98">&#9679;</span> pupa<br>
  Speed: <button onclick="sp(1)">1x</button> <button onclick="sp(2)">2x</button> <button onclick="sp(4)">4x</button> <button onclick="sp(8)">8x</button><br>
  <span style="color:#999">Drag to rotate, wheel to zoom</span>
</div>
<div id="side" class="panel">
  <b>Ants</b>
  <table><thead><tr><th>Ant</th><th>Doing</th><th>Fed</th><th>Food mem</th><th>Energy</th></tr></thead><tbody id="rows"></tbody></table>
  <b>Events</b><div id="log"></div>
</div>
<div id="status">Connecting...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const A = 50, H = 25, NEST = [25, 25];
const STATE = ['foraging', 'carrying food', 'going to eat', 'fetching soil', 'building', 'queen'];
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14110e);
scene.fog = new THREE.Fog(0x14110e, 70, 140);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xfff2dd, 0x2a2018, 0.9));
const sun = new THREE.DirectionalLight(0xffe9c4, 0.8); sun.position.set(30, 50, 20); scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(A, A), new THREE.MeshLambertMaterial({ color: 0x5a4632 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const pc = document.createElement('canvas'); pc.width = pc.height = A;
const pctx = pc.getContext('2d'), pimg = pctx.createImageData(A, A);
const ptex = new THREE.CanvasTexture(pc); ptex.magFilter = THREE.LinearFilter;
const pher = new THREE.Mesh(new THREE.PlaneGeometry(A, A), new THREE.MeshBasicMaterial({ map: ptex, transparent: true, depthWrite: false }));
pher.rotation.x = -Math.PI / 2; pher.position.y = 0.03; scene.add(pher);
const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(A, 1, A)), new THREE.LineBasicMaterial({ color: 0x8a6d4a }));
edge.position.y = 0.5; scene.add(edge);
const nest = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.6, 24), new THREE.MeshLambertMaterial({ color: 0x3b2c1e }));
nest.position.set(NEST[0] - H, 0.8, NEST[1] - H); scene.add(nest);

// pellets (nest structures)
const pelletGeo = new THREE.BoxGeometry(0.7, 0.55, 0.7), pelletMat = new THREE.MeshLambertMaterial({ color: 0x8a6a45 });
let pelletMeshes = [];
// brood
const broodMeshes = [], broodMats = [0xf5f0e0, 0xe8d9a0, 0xbb9988];
const broodGeos = [new THREE.SphereGeometry(0.22, 8, 6), new THREE.SphereGeometry(0.3, 8, 6), new THREE.SphereGeometry(0.34, 8, 6)];

let srcMeshes = [], ants = new Map();
function makeSrc(kind) {
  const f = kind === 'food';
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14),
    new THREE.MeshLambertMaterial({ color: f ? 0x55dd55 : 0xcc44ff, emissive: f ? 0x113311 : 0x330044 }));
  scene.add(m); return m;
}
function makeAnt(queen) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: queen ? 0x3a2a10 : 0x1a1210 });
  const seg = (r, sx, x, m) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), m || mat); s.scale.set(sx, 0.8, 0.8); s.position.set(x, 0.55, 0); g.add(s); };
  if (queen) {
    seg(0.55, 1.8, -1.0, new THREE.MeshLambertMaterial({ color: 0xc9962b, emissive: 0x332200 })); seg(0.34, 1.1, -0.05); seg(0.28, 1, 0.55);
    const wing = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    [-1, 1].forEach(s => { const w = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.5), wing); w.rotation.x = -Math.PI / 2; w.position.set(-0.5, 0.95, s * 0.45); g.add(w); });
  } else { seg(0.38, 1.4, -0.75); seg(0.26, 1.1, -0.05); seg(0.24, 1, 0.5); }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(36), 3));
  const legs = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x1a1210 })); g.add(legs);
  const food = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), new THREE.MeshLambertMaterial({ color: 0xffaa33, emissive: 0x663300 }));
  food.position.set(0.85, 0.7, 0); g.add(food);
  const soil = new THREE.Mesh(pelletGeo, pelletMat); soil.position.set(0.85, 0.75, 0); soil.scale.setScalar(0.7); g.add(soil);
  g.userData = { legs, food, soil, x: null, y: null, h: 0, queen }; g.scale.setScalar(queen ? 1.6 : 1.3);
  scene.add(g); return g;
}
function setLegs(ant, phase) {
  const p = ant.userData.legs.geometry.attributes.position.array; let k = 0;
  for (let i = 0; i < 6; i++) {
    const side = i % 2 ? 1 : -1, x = -0.2 + (Math.floor(i / 2) - 1) * 0.35, sw = Math.sin(phase + i * 2.1) * 0.25;
    p[k++] = x; p[k++] = 0.5; p[k++] = side * 0.2; p[k++] = x + sw; p[k++] = 0.02; p[k++] = side * 0.85;
  }
  ant.userData.legs.geometry.attributes.position.needsUpdate = true;
}

let theta = 0.8, phi = 0.95, dist = 62, drag = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => { if (!drag) return; theta -= (e.clientX - lx) * 0.006; phi = Math.max(0.15, Math.min(1.5, phi - (e.clientY - ly) * 0.006)); lx = e.clientX; ly = e.clientY; });
addEventListener('wheel', e => { dist = Math.max(12, Math.min(110, dist * (1 + e.deltaY * 0.001))); }, { passive: true });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
let latest = null;
function sp(v) { fetch('/speed?v=' + v); }

function onFrame(f) {
  latest = f;
  if (srcMeshes.length !== f.s.length) { srcMeshes.forEach(m => scene.remove(m)); srcMeshes = f.s.map(s => makeSrc(s[0])); }
  if (f.p) {
    for (let i = 0; i < A * A; i++) {
      const v = Math.min(1, f.p[i] / 10 * 0.6), o = i * 4;
      pimg.data[o] = 255; pimg.data[o + 1] = 120 + 100 * v; pimg.data[o + 2] = 40; pimg.data[o + 3] = Math.min(230, 255 * Math.sqrt(v));
    }
    pctx.putImageData(pimg, 0, 0); ptex.needsUpdate = true;
  }
  while (pelletMeshes.length < f.pl.length) { const m = new THREE.Mesh(pelletGeo, pelletMat); scene.add(m); pelletMeshes.push(m); }
  f.pl.forEach((p, i) => pelletMeshes[i].position.set(p[0] - H, 0.28 + p[2] * 0.5, p[1] - H));
  while (broodMeshes.length < f.b.length) broodMeshes.push(null);
  f.b.forEach((b, i) => {
    if (!broodMeshes[i]) { broodMeshes[i] = new THREE.Mesh(broodGeos[0], new THREE.MeshLambertMaterial({ color: 0xffffff })); scene.add(broodMeshes[i]); }
    const m = broodMeshes[i]; m.geometry = broodGeos[b[2]]; m.material.color.setHex(broodMats[b[2]]);
    m.position.set(b[0] - H, 1.0, b[1] - H); m.visible = true;
  });
  for (let i = f.b.length; i < broodMeshes.length; i++) if (broodMeshes[i]) broodMeshes[i].visible = false;
  const seen = new Set();
  f.a.forEach(a => {
    seen.add(a[0]);
    if (!ants.has(a[0])) ants.set(a[0], makeAnt(a[1] === 0));
  });
  for (const [id, m] of ants) if (!seen.has(id)) { scene.remove(m); ants.delete(id); }
  $('store').textContent = f.store; $('deliv').textContent = f.d; $('ch').textContent = f.ch; $('cap').textContent = f.cap;
  $('pop').textContent = f.a.length; $('born').textContent = f.born; $('died').textContent = f.died; $('brood').textContent = f.b.length;
  $('rows').innerHTML = f.a.map(a =>
    `<tr><td>${a[1] === 0 ? 'Queen' : '#' + a[0]}</td><td class="s${a[5]}">${STATE[a[5]]}</td><td>${a[1] ? a[6] : '-'}</td><td>${a[1] ? a[7] : '-'}</td><td>${a[9]}</td></tr>`).join('');
  if (f.ev.length) {
    const log = $('log');
    f.ev.forEach(e => { const d = document.createElement('div'); d.textContent = e; log.prepend(d); });
    while (log.children.length > 14) log.lastChild.remove();
  }
}

function connect() {
  const es = new EventSource('/stream');
  es.onopen = () => { $('status').textContent = 'LIVE'; $('status').style.color = '#6f6'; };
  es.onmessage = e => onFrame(JSON.parse(e.data));
  es.onerror = () => { $('status').textContent = 'Disconnected, retrying...'; $('status').style.color = '#f66'; es.close(); setTimeout(connect, 2000); };
}
connect();

function angLerp(a, b, k) { const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * k; }
function render(now) {
  if (latest) {
    latest.a.forEach((a, n) => {
      const ant = ants.get(a[0]); if (!ant) return; const u = ant.userData;
      const jump = u.x === null || Math.hypot(a[2] - u.x, a[3] - u.y) > 4;
      u.x = jump ? a[2] : u.x + (a[2] - u.x) * 0.35; u.y = jump ? a[3] : u.y + (a[3] - u.y) * 0.35;
      u.h = angLerp(u.h, a[4], 0.35);
      ant.position.set(u.x - H, 0, u.y - H); ant.rotation.y = -u.h;
      u.food.visible = a[5] === 1; u.soil.visible = a[5] === 4 || (a[5] === 3 && false);
      setLegs(ant, now / 60 + n);
    });
    latest.s.forEach((s, m) => {
      const r = s[0] === 'food' ? 0.5 + 0.12 * s[3] : 1.0;
      srcMeshes[m].scale.setScalar(r); srcMeshes[m].position.set(s[1] - H, r * 0.8, s[2] - H);
    });
  }
  camera.position.set(Math.sin(theta) * Math.cos(phi) * dist, Math.sin(phi) * dist, Math.cos(theta) * Math.cos(phi) * dist);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
